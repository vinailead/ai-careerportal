[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-portal"
version = "1.0.0"
description = "Google Material Design 3 AI Job Search, Deterministic ATS Match Scoring, and 1:1 Grounded-Truth CV Tailoring Portal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Vinoth Nataraj", email = "vinoth.n@outlook.com" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-docx>=1.1.0",
  "reportlab>=4.1.0",
  "pymupdf>=1.24.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
